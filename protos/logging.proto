syntax = "proto3";
package proto.logging;

message LogData {
  enum Severity {
    TRACE = 0;
    INFO = 1;
    WARNING = 2;
    ERROR = 3;
    CRITICAL = 4;
  }

  uint64 timestamp = 1;
  Severity severity = 2;

  string filepath = 3;
  uint32 line_number = 4;

  string sink = 5;
  string message = 6;
  string details = 7;    // long or multi-line body, empty for most logs
  string backtrace = 8;  // resolved frames, one per line
}

message LogBatch {
  repeated LogData logs = 1;
}
